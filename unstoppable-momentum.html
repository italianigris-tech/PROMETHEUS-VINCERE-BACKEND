<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>UNSTOPPABLE MOMENTUM — Prometheus Kinetic Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,400;0,700;0,900;1,700;1,900&family=Syne:wght@700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --crimson-accent: #ff122b;
      --gold-accent: #ffe066;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: grid;
      place-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .stage {
      position: relative;
      width: min(100vw, 56.25svh);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      isolation: isolate;
      container-type: inline-size;
      background: #000000;
      box-shadow: 0 0 120px rgba(255, 18, 43, 0.3);
    }

    .ambient-field {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 65% 45%, rgba(255, 18, 43, 0.32) 0%, rgba(230, 184, 0, 0.12) 50%, #000000 95%);
    }

    /* Layer 2: Solid Fill Ultra-Tall Hero Word (BEHIND Asset - z-index: 2) */
    .hero-back-wrap {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82cqw;
      z-index: 2;
      pointer-events: none;
      text-align: center;
    }

    .word-unstoppable {
      font-size: 10.2cqw;
      line-height: 0.9;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.01em;
      transform: scaleY(1.45) scaleX(0.88);
      transform-origin: center center;
    }

    .hero-back-wrap .char {
      display: inline-block;
      font-weight: 900;
      font-family: 'Syne', sans-serif;
      color: #ffffff;
      text-shadow: 0 15px 35px rgba(0, 0, 0, 0.95);
      opacity: 0;
      filter: blur(24px);
      animation: char-reveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Midground Archetype Layer with Gyro Pendulum Velocity Entry (z-index: 3) */
    .panther-wrap {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82cqw;
      z-index: 3;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, black 75%, transparent 98%);
      -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent 98%);
      transform-origin: 60% 80%;
      opacity: 0;
      animation: gyro-panther-reveal 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .panther-img {
      width: 100%;
      height: auto;
      display: block;
      filter: contrast(1.3) brightness(1.05) drop-shadow(0 20px 45px rgba(0,0,0,0.98));
    }

    /* Layer 4: Hairline Stroke Foreground & Subtext (z-index: 4) */
    .hero-front-wrap {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84cqw;
      z-index: 4;
      pointer-events: none;
      text-align: center;
    }

    .connector-badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-style: italic;
      font-weight: 700;
      font-size: 3.2cqw;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      color: var(--gold-accent);
      background: rgba(230, 184, 0, 0.18);
      border: 1px solid rgba(230, 184, 0, 0.45);
      padding: 4px 14px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      margin-bottom: 1.5cqw;
      opacity: 0;
      animation: text-glide 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    .word-momentum {
      font-size: 13.5cqw;
      line-height: 0.9;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.02em;
      transform: scaleY(1.35) scaleX(0.92);
      transform-origin: center center;
    }

    .hero-front-wrap .char {
      display: inline-block;
      font-weight: 900;
      font-family: 'Syne', sans-serif;
      color: transparent !important;
      -webkit-text-stroke: 1.6px #ffffff;
      text-shadow: 0 10px 25px rgba(0,0,0,0.9);
      opacity: 0;
      filter: blur(24px);
      animation: char-reveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Top & Middle Subtext Phrases */
    .subtext-top {
      position: absolute;
      top: 8.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 80cqw;
      z-index: 4;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 2.6cqw;
      line-height: 1.4;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.88);
      text-wrap: balance;
    }

    /* Morphing Glass Container on Bottom Subtext */
    .subtext-bottom-wrap {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 80cqw;
    }

    .morph-box {
      position: absolute;
      inset: -6px -12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 18, 43, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      opacity: 0;
      filter: blur(20px);
      transform: translateY(25px) scale(0.6);
      animation: morph-box-reveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    .subtext-bottom {
      position: relative;
      z-index: 2;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 2.6cqw;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
      text-wrap: balance;
    }

    .sub-char {
      display: inline-block;
      opacity: 0;
      filter: blur(12px);
      transform: translateY(15px);
      animation: sub-reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* HUD Bar */
    .timer-hud {
      position: absolute;
      top: 3.5%;
      left: 5%;
      right: 5%;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Space Mono', monospace;
      font-size: 2.2cqw;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hud-badge {
      background: rgba(255, 18, 43, 0.25);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255, 18, 43, 0.5);
      backdrop-filter: blur(8px);
    }

    .grain {
      position: absolute;
      inset: -50%;
      z-index: 12;
      opacity: 0.12;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.8'/%3E%3C/svg%3E");
      animation: grain-noise 0.2s steps(2) infinite;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9), inset 0 -160px 120px rgba(0, 0, 0, 0.95);
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--crimson-accent);
      z-index: 25;
      width: 0%;
      animation: progress-run 4s linear infinite;
    }

    /* Keyframe Animations */
    
    /* Physics Preset 3: Angular Gyro Pendulum Velocity Reveal */
    @keyframes gyro-panther-reveal {
      0% {
        opacity: 0;
        filter: blur(22px) contrast(1.6);
        transform: translate(-45%, -48%) rotateY(32deg) skewY(-8deg) scale(1.18);
      }
      60% {
        filter: blur(3px) contrast(1.2);
        transform: translate(-50%, -50%) rotateY(-4deg) skewY(1deg) scale(0.98);
      }
      100% {
        opacity: 0.95;
        filter: blur(0px) contrast(1.3);
        transform: translate(-50%, -50%) rotateY(0deg) skewY(0deg) scale(1);
      }
    }

    @keyframes morph-box-reveal {
      0% {
        opacity: 0;
        filter: blur(20px);
        transform: translateY(25px) scale(0.6);
        border-radius: 50px;
      }
      60% {
        filter: blur(4px);
        transform: translateY(-2px) scale(1.05);
        border-radius: 16px;
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0) scale(1);
        border-radius: 20px;
      }
    }

    @keyframes text-glide {
      0% { opacity: 0; filter: blur(16px); transform: translateY(12px); }
      100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
    }

    @keyframes char-reveal {
      0% { opacity: 0; filter: blur(24px); transform: translateY(30px); }
      100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
    }

    @keyframes sub-reveal {
      0% { opacity: 0; filter: blur(12px); transform: translateY(15px); }
      100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
    }

    @keyframes progress-run {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes grain-noise {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 2%); }
      50% { transform: translate(2%, -1%); }
      75% { transform: translate(-1%, -2%); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
