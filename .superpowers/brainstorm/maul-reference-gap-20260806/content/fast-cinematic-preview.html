<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MAUL Cinematic SVG Session</title>
  <style>
    @font-face{font-family:Bebas;src:url('bebas-neue-400.woff2')}@font-face{font-family:Vibes;src:url('great-vibes-400.ttf')}@font-face{font-family:Playfair;src:url('playfair-display-700.woff2')}@font-face{font-family:DMSans;src:url('dm-sans-700.woff2')}@font-face{font-family:DMSerif;src:url('dm-serif-display-400.woff2')}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030507}body{display:grid;place-items:center;font-family:DMSans,Arial,sans-serif}
    #stage{position:relative;height:96vh;max-width:96vw;aspect-ratio:9/16;overflow:hidden;background:#090d12;box-shadow:0 20px 80px #000}
    .warm,.cool{position:absolute;z-index:0;top:13%;height:56%;width:1.1%;background:#f06424;box-shadow:0 0 34px 12px rgba(240,100,36,.4)}.warm{left:6%}.cool{right:7%;top:20%;height:44%;background:#00b7c7;box-shadow:0 0 30px 10px rgba(0,183,199,.25)}
    .floor{position:absolute;inset:auto 0 0;height:28%;background:#05070a;opacity:.8}.layer{position:absolute;inset:0}.behind{z-index:2}.subject{position:absolute;z-index:3;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(.92) brightness(.96);animation:camera 3s ease-in-out infinite alternate}.front{z-index:4}.flash{position:absolute;z-index:5;inset:0;pointer-events:none}.progress{position:absolute;z-index:6;left:5%;right:5%;bottom:2.3%;height:3px;display:flex;gap:5px}.progress i{flex:1;background:rgba(255,255,255,.18)}.progress i.on{background:#f06424;box-shadow:0 0 8px #f06424}
    svg{width:100%;height:100%;overflow:visible}.type{fill:#f7f3ea;text-anchor:middle;paint-order:stroke;stroke:#090d12;stroke-width:5px;stroke-linejoin:round}.display{font-family:Bebas;font-size:148px;letter-spacing:0}.serif{font-family:Playfair;font-size:122px}.script{font-family:Vibes;font-size:118px;fill:#f06424;stroke-width:3px}.support{font-family:DMSans;font-size:72px}.orange{fill:#f06424}.cyan{fill:#00d3df}.rule{stroke:#f06424;stroke-width:9;stroke-linecap:round}.ghostR{fill:#f06424;opacity:.5;stroke:none}.ghostC{fill:#00d3df;opacity:.45;stroke:none}
    @keyframes camera{to{transform:scale(1.035) translateY(-.3%)}}@keyframes settle{0%{opacity:0;transform:translateY(70px) scale(.72);filter:blur(18px)}60%{opacity:1;transform:translateY(-10px) scale(1.08);filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}@keyframes fadeout{to{opacity:0;filter:blur(14px);transform:scale(.96)}}
    .beat{animation:fadeout .2s ease-in forwards;animation-delay:1.5s}.beat .word{transform-box:fill-box;transform-origin:center;animation:settle .72s cubic-bezier(.16,1,.3,1) both}.beat .w1{animation-delay:.13s}.beat .w2{animation-delay:.24s}.beat .w3{animation-delay:.34s}
    .p0 .main{animation:chromatic .85s cubic-bezier(.16,1,.3,1) both}.p0 .g1{animation:ghostL .65s ease-out both}.p0 .g2{animation:ghostR .65s ease-out both}.p0 .rule{stroke-dasharray:600;stroke-dashoffset:600;animation:draw .7s .15s ease-out forwards}
    @keyframes chromatic{0%{opacity:0;filter:blur(24px);transform:scale(1.45)}100%{opacity:1;filter:blur(0);transform:none}}@keyframes ghostL{0%{transform:translateX(-90px);opacity:0}100%{transform:translateX(-15px);opacity:.4}}@keyframes ghostR{0%{transform:translateX(90px);opacity:0}100%{transform:translateX(15px);opacity:.4}}@keyframes draw{to{stroke-dashoffset:0}}
    .p1 .char{animation:charDrop .55s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*45ms)}@keyframes charDrop{0%{opacity:0;transform:translateY(-100px) scale(.6);filter:blur(16px)}100%{opacity:1;transform:none;filter:blur(0)}}
    .p2 .script{animation:slideScript .65s ease-out both}.p2 .display{animation:charDrop .72s .12s cubic-bezier(.16,1,.3,1) both}@keyframes slideScript{from{opacity:0;transform:translateX(-170px);filter:blur(12px)}to{opacity:1;transform:none}}
    .p3{clip-path:inset(0 50% 0 50%);animation:slit .8s cubic-bezier(.16,1,.3,1) forwards,fadeout .2s 1.5s forwards}@keyframes slit{to{clip-path:inset(0)}}
    .p4 .w1{animation:fromLeft .65s both}.p4 .w2{animation:fromRight .65s both}@keyframes fromLeft{from{opacity:0;transform:translateX(-260px)}to{opacity:1;transform:none}}@keyframes fromRight{from{opacity:0;transform:translateX(260px)}to{opacity:1;transform:none}}
    .p5 .w1{animation:impactL .62s cubic-bezier(.34,1.56,.64,1) both}.p5 .w2{animation:impactR .62s cubic-bezier(.34,1.56,.64,1) both}@keyframes impactL{from{opacity:0;transform:translateX(-350px) scale(1.5)}to{opacity:1;transform:none}}@keyframes impactR{from{opacity:0;transform:translateX(350px) scale(1.5)}to{opacity:1;transform:none}}
    .p6 .char{animation:charDrop .58s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*35ms)}.p7 .word{animation:blurLuxury .85s cubic-bezier(.16,1,.3,1) both}@keyframes blurLuxury{from{opacity:0;filter:blur(28px);transform:scale(1.28)}to{opacity:1;filter:blur(0);transform:none}}
    .p8 .word{animation:elastic .8s cubic-bezier(.34,1.56,.64,1) both}@keyframes elastic{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}
    .p9 .word{animation:fog 1s ease-out both}@keyframes fog{from{opacity:0;filter:blur(40px);letter-spacing:22px}to{opacity:1;filter:blur(0);letter-spacing:0}}
    .p10 .script{animation:slideScript .6s both}.p10 .w1{animation-delay:.12s}.p10 .w2{animation-delay:.24s}.p10 .display{animation:charDrop .7s .3s both}
    .p11 .typed{clip-path:inset(0 100% 0 0);animation:type 1.1s steps(18,end) forwards}.p11 .cursor{animation:cursor 1.1s steps(18,end) forwards,blink .35s infinite}@keyframes type{to{clip-path:inset(0)}}@keyframes cursor{to{transform:translateX(570px)}}@keyframes blink{50%{opacity:0}}
    @keyframes hit{0%{opacity:.28;background:#f06424}100%{opacity:0;background:#f06424}}
  </style>
</head>
<body>
  <main id="stage">
    <div class="warm"></div><div class="cool"></div><div class="floor"></div>
    <div id="behind" class="layer behind"></div>
    <img class="subject" src="THE matted LADY TALKING HEAD MAUL TESTING.png" alt="">
    <div id="front" class="layer front"></div><div id="flash" class="flash"></div><div id="progress" class="progress"></div>
  </main>
  <script>
    const beats=[
      {p:0,w:['SPEED'],d:'behind',y:[930]},
      {p:1,w:['EVERYTHING'],d:'front',y:[1320],chars:true},
      {p:2,w:['CLEAR','STRATEGY'],d:'front',y:[650,800]},
      {p:3,w:['RUNNING','CIRCLES'],d:'behind',y:[850,1030]},
      {p:4,w:['TRUE','BUSINESS','GROWTH'],d:'front',y:[1210,1370,1510]},
      {p:5,w:['WITH','ABSOLUTE','FOCUS'],d:'front',y:[880,1040,1190]},
      {p:6,w:['LOOK','AT','DATA'],d:'front',y:[610,760,900],chars:true},
      {p:7,w:['DEEPEST','PAIN','POINTS'],d:'behind',y:[770,950,1110]},
      {p:8,w:['ELIMINATE','THE','FRICTION'],d:'front',y:[1200,1360,1510]},
      {p:9,w:['ALIGN','YOUR TEAM'],d:'front',y:[650,820]},
      {p:10,w:['ONE','SINGLE','MASSIVE','GOAL'],d:'behind',y:[690,820,950,1120]},
      {p:11,w:['BUILD','A','SYSTEM'],d:'front',y:[1190,1320,1470],typed:true}
    ];
    const behind=document.querySelector('#behind'),front=document.querySelector('#front'),flash=document.querySelector('#flash'),progress=document.querySelector('#progress');
    beats.forEach(()=>progress.append(document.createElement('i')));
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    function charText(word,y,cls='display'){
      const width=Math.min(720,word.length*92),start=540-width/2+42;
      return `<g class="${cls}">${[...word].map((c,i)=>`<text class="type char ${cls}" x="${start+i*(width/word.length)}" y="${y}" style="--i:${i}">${esc(c)}</text>`).join('')}</g>`;
    }
    function normalWords(b){return b.w.map((w,i)=>{
      const cls=i===0&&b.w.length>1?'script':i===1&&b.w.length>2?'display':i===b.w.length-1?'display orange':'support';
      return `<text class="type word w${i} ${cls}" x="540" y="${b.y[i]}">${esc(w)}</text>`;
    }).join('')}
    function svg(b){
      let body=b.chars?b.w.map((w,i)=>charText(w,b.y[i],i===0&&b.w.length>1?'script':'display')).join(''):normalWords(b);
      if(b.p===0) body=`<text class="type display ghostR g1" x="525" y="930">SPEED</text><text class="type display ghostC g2" x="555" y="930">SPEED</text><text class="type display main" x="540" y="930">SPEED</text><line class="rule" x1="240" x2="840" y1="990" y2="990"/>`;
      if(b.typed) body=`<g class="typed"><text class="type support" x="540" y="1190">BUILD</text><text class="type serif orange" x="540" y="1340">A</text><text class="type display" x="540" y="1500">SYSTEM</text></g><line class="cursor" x1="250" x2="250" y1="1390" y2="1530" stroke="#f06424" stroke-width="12"/>`;
      return `<svg class="beat p${b.p}" viewBox="0 0 1080 1920" aria-hidden="true">${body}</svg>`;
    }
    let index=0,timer;
    function show(){
      behind.innerHTML='';front.innerHTML='';
      const b=beats[index],host=b.d==='behind'?behind:front;host.innerHTML=svg(b);
      [...progress.children].forEach((x,i)=>x.classList.toggle('on',i===index));
      flash.style.animation='none';void flash.offsetWidth;flash.style.animation='hit .22s ease-out';
      index=(index+1)%beats.length;timer=setTimeout(show,1750);
    }
    document.addEventListener('click',()=>{clearTimeout(timer);show()});show();
  </script>
</body>
</html>
