  <!-- Authentic Typography Reference CSS (65KB) -->
  <style>

    :root {
      --bg-primary: #050507;
      --bg-secondary: #0c0c12;
      --bg-card: #12121c;
      --bg-preview: #040406;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(6, 182, 212, 0.4);
      --accent-cyan: #06b6d4;
      --accent-purple: #7c3aed;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-apple);
      min-height: 100vh;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5, 5, 7, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 18px 36px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      color: #000; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 20px;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.3);
    }
    .brand-title h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
    .brand-title p { font-size: 12px; color: var(--text-secondary); }

    .nav-links { display: flex; align-items: center; gap: 12px; }
    .nav-btn {
      background: var(--bg-secondary); border: 1px solid var(--border-subtle);
      color: var(--text-secondary); padding: 8px 16px; border-radius: 8px;
      font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    .header-search-bar {
      position: relative; display: flex; align-items: center; flex: 1; max-width: 440px; margin: 0 16px;
    }
    .header-search-input {
      width: 100%; padding: 9px 36px 9px 14px; background: var(--bg-secondary);
      border: 1px solid var(--border-subtle); border-radius: 10px; color: var(--text-primary);
      font-size: 13px; font-family: var(--font-apple); outline: none; transition: all 0.2s ease;
    }
    .header-search-input:focus {
      border-color: var(--accent-cyan); box-shadow: 0 0 16px rgba(6, 182, 212, 0.3);
    }
    .header-search-clear {
      position: absolute; right: 10px; background: transparent; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 14px; display: none;
    }
    .header-search-clear:hover { color: #fff; }

    .container { max-width: 1700px; margin: 0 auto; padding: 36px; }

    .banner {
      background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(6,182,212,0.06));
      border: 1px solid var(--border-subtle); border-radius: 18px;
      padding: 28px 36px; margin-bottom: 40px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }

    .banner-text h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
    .banner-text p { font-size: 14px; color: var(--text-secondary); }
    .banner-badge {
      background: #ffffff; color: #000; font-size: 13px; font-weight: 800;
      padding: 8px 18px; border-radius: 20px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 36px; }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .card:hover {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.1);
      transform: translateY(-4px);
    }

    .card-header {
      padding: 18px 24px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle); background: rgba(0, 0, 0, 0.4);
    }
    .card-title-group { display: flex; align-items: center; gap: 12px; }
    .card-badge {
      font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: #fff;
      background: rgba(255, 255, 255, 0.14); padding: 4px 10px; border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .card-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .inspect-btn {
      background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4);
      color: #38bdf8; border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 4px;
    }
    .inspect-btn:hover { background: #06b6d4; color: #000; box-shadow: 0 0 16px rgba(6,182,212,0.5); }

    .replay-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-primary); border-radius: 8px; padding: 7px 14px; font-size: 12px;
      font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s ease;
    }
    .replay-btn:hover { background: #ffffff; color: #000; box-shadow: 0 0 18px rgba(255, 255, 255, 0.5); }
    .replay-btn:active { transform: scale(0.94); }
    .replay-btn svg { width: 14px; height: 14px; fill: currentColor; transition: transform 0.3s ease; }
    .replay-btn:hover svg { transform: rotate(-180deg); }

    .preview-stage {
      height: 320px; background: var(--bg-preview); position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; padding: 32px; width: 100%;
    }

    .card-footer {
      padding: 16px 24px; border-top: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.25); display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: var(--text-secondary); font-family: var(--font-mono);
    }

    .trait-drawer {
      background: #09090e; border-top: 1px solid rgba(6, 182, 212, 0.3);
      padding: 20px 24px; display: none; font-family: var(--font-mono); font-size: 12px;
      color: #cbd5e1; animation: slide-down 0.25s ease-out;
    }
    .trait-drawer.open { display: block; }
    @keyframes slide-down { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .drawer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
    .drawer-tag { display: inline-block; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; color: #fff; margin-right: 6px; font-weight: 700; }
    .drawer-code { background: #000; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); color: #38bdf8; overflow-x: auto; margin-top: 6px; }

    /* PRESET STYLES */
    @keyframes apple-hero-anim { 0% { opacity: 0; transform: translateY(32px) scale(0.93); filter: blur(18px); letter-spacing: -0.05em; } 60% { opacity: 1; transform: translateY(-2px) scale(1.01); filter: blur(0px); letter-spacing: -0.03em; } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); letter-spacing: -0.03em; } }
    .typo-apple-hero { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; animation: apple-hero-anim 3.2s infinite var(--ease-apple); }

    @keyframes char-cascade-anim { 0% { opacity: 0; transform: translateY(28px) rotateX(-90deg); filter: blur(10px); } 100% { opacity: 1; transform: translateY(0) rotateX(0deg); filter: blur(0px); } }
    .char-box { display: flex; gap: 6px; perspective: 500px; }

    .typo-keynote-punch { font-size: 38px; font-weight: 900; letter-spacing: -0.02em; text-align: center; animation: keynote-punch-anim 2.8s infinite var(--ease-apple); }

    @keyframes blur-mask-anim { 0% { filter: blur(26px); opacity: 0; transform: scale(0.90); } 50%, 100% { filter: blur(0px); opacity: 1; transform: scale(1); } }

    .exact-blur-text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 38px; font-weight: 400; color: #262626; letter-spacing: -0.02em; display: flex; gap: 10px; }

    .hexta-typewriter-stage { background: #ffffff; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 32px; border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); }
    .hexta-typewriter-box { position: relative; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 36px; font-weight: 400; color: #1c1c1e; letter-spacing: -0.02em; display: inline-flex; align-items: center; }

    @keyframes vercel-wipe { 0% { transform: scaleX(0); } 30%, 80% { transform: scaleX(1); } 100% { transform: scaleX(0); } }

    .iso-word { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 32px; font-weight: 900; letter-spacing: -0.04em; color: #050505; text-transform: uppercase; text-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); animation: iso-word-wave 3.2s infinite var(--ease-apple); }

    .hand-drawn-stage { background: #ffffff; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); }
    .hand-drawn-text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 42px; font-weight: 800; color: #000000; letter-spacing: -0.02em; }

    @keyframes gradient-fade-sweep-anim { 0% { opacity: 0.2; background-position: -100% 0; } 40%, 80% { opacity: 1; background-position: 0% 0; } 100% { opacity: 0.2; background-position: 100% 0; } }

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-purple: #c084fc;
      --accent-rose: #f43f5e;
      --accent-gold: #fbbf24;
      --font-ui: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }

    /* Sticky Master Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 9, 14, 0.95);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 28px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #000;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .stats-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid transparent;
    }

    .stat-pill.emerald { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .stat-pill.cyan { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
    .stat-pill.amber { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }
    .stat-pill.purple { background: rgba(192, 132, 252, 0.12); color: #c084fc; border-color: rgba(192, 132, 252, 0.3); }
    .stat-pill.rose { background: rgba(244, 63, 94, 0.12); color: #f43f5e; border-color: rgba(244, 63, 94, 0.3); }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1.2fr 1.5fr 2fr auto;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 1024px) {
      .controls-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 640px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .search-input, .text-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font-ui);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus, .text-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .timeline-master-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .btn-ctrl {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-ctrl:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent-cyan);
    }

    .btn-ctrl.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .scrubber-slider {
      flex: 1;
      accent-color: var(--accent-cyan);
      cursor: pointer;
      height: 5px;
    }

    .time-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
      min-width: 44px;
      text-align: right;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 28px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(13, 18, 29, 0.6);
    }

    .filter-tab {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tab:hover {
      color: var(--text-main);
      border-color: rgba(255,255,255,0.2);
    }

    .filter-tab.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    /* Cards Grid */
    .container {
      max-width: 1680px;
      margin: 0 auto;
      padding: 24px 28px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
      gap: 24px;
    }

    @media (max-width: 540px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    .anim-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.2s, border-color 0.2s;
    }

    .anim-card:hover {
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }

    /* Card Status Border Accents */
    .anim-card.active-preset { border-left: 4px solid var(--accent-emerald); }
    .anim-card.lockup-preset { border-left: 4px solid var(--accent-cyan); }
    .anim-card.viral-preset { border-left: 4px solid var(--accent-gold); }
    .anim-card.dormant-preset { border-left: 4px solid var(--accent-amber); }
    .anim-card.hook-preset { border-left: 4px solid var(--accent-purple); }
    .anim-card.unimplemented-preset { border-left: 4px solid var(--accent-rose); }

    .card-header {
      padding: 14px 18px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .card-idx {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-title-group h3 {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .card-id-code {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badges-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 9999px;
      letter-spacing: 0.04em;
    }

    .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-lockup { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-viral { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.4); }
    .badge-dormant { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-hook { background: rgba(192, 132, 252, 0.2); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.4); }
    .badge-unimplemented { background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.4); }

    /* Stage Viewport */
    .stage-container {
      height: 180px;
      position: relative;
      background: var(--bg-stage);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .stage-grid-lines {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .anim-viewport {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Individual Card Controls */
    .card-controls {
      padding: 10px 18px;
      background: rgba(255,255,255,0.02);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-scrubber {
      flex: 1;
      height: 4px;
      accent-color: var(--accent-cyan);
    }

    .card-time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      min-width: 32px;
      text-align: right;
    }

    /* Trait Drawer / Forensic Info */
    .card-info {
      padding: 12px 18px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      background: rgba(13, 18, 29, 0.4);
    }

    .info-row {
      display: flex;
      margin-bottom: 5px;
      gap: 8px;
    }

    .info-lbl {
      color: var(--text-muted);
      font-weight: 600;
      min-width: 80px;
      flex-shrink: 0;
    }

    .info-val {
      color: var(--text-main);
      word-break: break-word;
    }

    .info-val.highlight {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .drawer-toggle-btn {
      background: none;
      border: none;
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      padding: 0;
    }

    .drawer-toggle-btn:hover {
      text-decoration: underline;
    }

    .drawer-content {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255,255,255,0.1);
      font-size: 11px;
    }

    .drawer-content.open {
      display: block;
    }

    .gsap-recipe-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 6px;
      font-family: var(--font-mono);
      color: #34d399;
      font-size: 10.5px;
    }
  </style>
</head>

            <button class="btn-ctrl" onclick="replayCard('${item.id}')">Replay</button>
            <input type="range" class="scrubber-slider card-scrubber" id="scrubber-${item.id}" min="0" max="100" value="0" step="0.5" oninput="scrubCard('${item.id}', this.value)">
            <span class="card-time" id="time-${item.id}">0.0s</span>
          </div>

          <div class="card-info">
            <div class="info-row"><span class="info-lbl">Category:</span><span class="info-val highlight">${item.category}</span></div>
            <div class="info-row"><span class="info-lbl">Production:</span><span class="info-val">${item.activeCount}</span></div>
            <div class="info-row"><span class="info-lbl">Motion DNA:</span><span class="info-val">${item.notes}</span></div>
            <button class="drawer-toggle-btn" onclick="toggleDrawer('${item.id}')">🔍 Trait Contract &amp; GSAP Upgrade</button>
            <div class="drawer-content" id="drawer-${item.id}">
              <div style="font-weight: 700; color: var(--accent-cyan); margin-bottom: 2px;">GSAP Modernization Vector:</div>
              <div class="gsap-recipe-box">${item.gsapVector}</div>
            </div>
          </div>
        `;

        cardsGrid.appendChild(card);

        // Initialize Card DOM via bespoke renderer
        const vp = document.getElementById(`viewport-${item.id}`);
        const renderer = RENDERERS[item.renderer];
        if (vp && renderer) {
          const txt = formatText(item, customText);
          renderer.init(vp, item, txt);
          renderer.update(vp, item, txt, masterProgress);
        }
      });
    }

    function toggleDrawer(id) {
      const d = document.getElementById(`drawer-${id}`);
      if (d) d.classList.toggle("open");
    }

    function updateAllCards(p) {
      PRESETS_DATA.forEach(item => {
        const vp = document.getElementById(`viewport-${item.id}`);
        const renderer = RENDERERS[item.renderer];
        if (vp && renderer) {
          const txt = formatText(item, customText);
          renderer.update(vp, item, txt, p);
        }
        const s = document.getElementById(`scrubber-${item.id}`);
        const t = document.getElementById(`time-${item.id}`);
        if (s) s.value = (p * 100).toFixed(1);
        if (t) t.innerText = `${(p * durationSec).toFixed(1)}s`;
      });
    }

    function tick(timestamp) {
      if (isPlaying) {
        const delta = (timestamp - lastTimestamp) / 1000;
        masterProgress += delta / durationSec;
        if (masterProgress > 1.0) masterProgress = 0;
        masterScrubber.value = (masterProgress * 100).toFixed(1);
        masterTime.innerText = `${(masterProgress * durationSec).toFixed(2)}s`;
        updateAllCards(masterProgress);
      }
      lastTimestamp = timestamp;
      requestAnimationFrame(tick);
    }

    btnPlayAll.onclick = () => {
      isPlaying = !isPlaying;
      btnPlayAll.innerText = isPlaying ? "Pause" : "Play";
      btnPlayAll.classList.toggle("active", isPlaying);
    };

    btnRestartAll.onclick = () => {
      masterProgress = 0;
      masterScrubber.value = 0;
      masterTime.innerText = "0.00s";
      updateAllCards(0);
    };

    masterScrubber.oninput = (e) => {
      isPlaying = false;
      btnPlayAll.innerText = "Play";
      btnPlayAll.classList.remove("active");
      masterProgress = parseFloat(e.target.value) / 100;
      masterTime.innerText = `${(masterProgress * durationSec).toFixed(2)}s`;
      updateAllCards(masterProgress);
    };

    function scrubCard(id, val) {
      isPlaying = false;
      btnPlayAll.innerText = "Play";
      btnPlayAll.classList.remove("active");
      const p = parseFloat(val) / 100;
      const item = PRESETS_DATA.find(x => x.id === id);
      if (!item) return;
      const vp = document.getElementById(`viewport-${id}`);
      const renderer = RENDERERS[item.renderer];
      if (vp && renderer) {
        const txt = formatText(item, customText);
        renderer.update(vp, item, txt, p);
      }
      const t = document.getElementById(`time-${id}`);
      if (t) t.innerText = `${(p * durationSec).toFixed(1)}s`;
    }

    function replayCard(id) {
      const item = PRESETS_DATA.find(x => x.id === id);
      if (!item) return;
      const vp = document.getElementById(`viewport-${id}`);
      const renderer = RENDERERS[item.renderer];
      if (!vp || !renderer) return;

      const txt = formatText(item, customText);
      renderer.init(vp, item, txt);

      let p = 0;
      const start = performance.now();
      function anim(t) {
        const elapsed = (t - start) / 1000;
        p = Math.min(1, elapsed / durationSec);
        renderer.update(vp, item, txt, p);
        const s = document.getElementById(`scrubber-${id}`);
        const timeEl = document.getElementById(`time-${id}`);
        if (s) s.value = (p * 100).toFixed(1);
        if (timeEl) timeEl.innerText = `${(p * durationSec).toFixed(1)}s`;
        if (p < 1) requestAnimationFrame(anim);
      }
      requestAnimationFrame(anim);
    }

    globalSearch.oninput = () => renderCards();

    globalCustomText.oninput = (e) => {
      customText = e.target.value || "PROMETHEUS";
      renderCards();
    };

    document.querySelectorAll(".filter-tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        renderCards();
      };
    });

    function setBackdrop(mode) {
      const stages = document.querySelectorAll(".stage-container");
      stages.forEach(st => {
        if (mode === "dark") st.style.background = "#05070a";
        else if (mode === "slate") st.style.background = "#0f172a";
        else if (mode === "light") st.style.background = "#f1f5f9";
      });
      event.target.parentElement.querySelectorAll(".btn-ctrl").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
    }

    // Boot
    renderCards();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
