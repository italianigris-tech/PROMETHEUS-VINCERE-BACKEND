<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GROWTH BEYOND BOUNDARIES — Perfect Manim Path Sweep Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,400;0,700;0,900;1,700;1,900&family=Syne:wght@700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --gold-accent: #ffe066;
      --cyan-accent: #00f0ff;
      --manim-green: #00ff66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: grid;
      place-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .stage {
      position: relative;
      width: min(100vw, 56.25svh);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      isolation: isolate;
      container-type: inline-size;
      background: #000000;
      box-shadow: 0 0 120px rgba(0, 255, 102, 0.25);
    }

    /* SCENE 1: Winged Statue, Live Manim Math Path Sweep & Shattering Boundaries */
    .scene-1 {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      animation: scene1-loop 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .ambient-field-1 {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 40%, rgba(0, 255, 102, 0.2) 0%, rgba(0, 240, 255, 0.1) 50%, #000000 95%);
    }

    /* Asset 1: Manim Math Electric Neon Green Chart (Centered DIRECTLY BEHIND STATUE BODY z-index: 1) */
    .manim-chart-wrap {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 86cqw;
      height: 60cqw;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      animation: chart-fade-loop 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .manim-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Clean Minimalist White L-Axis Lines */
    .axis-line {
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
    }

    /* Volumetric Dark-Green Gradient Under-Fill Sweeping Horizontally in Sync */
    .manim-area-fill {
      fill: url(#manim-green-fill);
      clip-path: url(#manim-fill-clip);
    }

    .fill-sweep-wrap {
      clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%);
      animation: fill-sweep-anim 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    /* Hyper-Luminous Electric Green Neon Line (pathLength normalized 1.0) */
    .manim-curve-line {
      fill: none;
      stroke: var(--manim-green);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      filter: drop-shadow(0 0 10px var(--manim-green)) drop-shadow(0 0 25px var(--manim-green));
      animation: manim-line-draw 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    /* Word 1: GROWTH (Clean Layer 2 Behind Statue Wings) */
    .word-growth-wrap {
      position: absolute;
      top: 24%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78cqw;
      z-index: 2;
      pointer-events: none;
      text-align: center;
    }

    .word-growth {
      font-family: 'Syne', sans-serif;
      font-weight: 900;
      font-size: 12.5cqw;
      line-height: 0.85;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #ffffff;
      transform: scaleY(1.45) scaleX(0.82);
      transform-origin: center center;
      text-shadow: 0 10px 30px rgba(0,0,0,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.02em;
    }

    .growth-char {
      display: inline-block;
      animation: char-reveal-loop 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    /* Midground Winged Marble Goddess Statue Asset (z-index: 3) */
    .statue-wrap {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84cqw;
      z-index: 3;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, black 75%, transparent 96%);
      -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent 96%);
      transform-origin: 50% 90%;
      animation: springboard-statue-loop 5.5s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
    }

    .statue-img {
      width: 100%;
      height: auto;
      display: block;
      filter: contrast(1.3) brightness(1.05) drop-shadow(0 20px 40px rgba(0,0,0,0.95));
    }

    /* Word 2: BOUNDARIES Inside Shattering Wireframe Box (Layer 4 In Front) */
    .boundary-box-wrap {
      position: absolute;
      bottom: 16%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      pointer-events: none;
      text-align: center;
      width: 80cqw;
    }

    .wireframe-box {
      position: relative;
      display: inline-block;
      padding: 8px 20px;
      border: 1px dashed var(--manim-green);
      background: rgba(0, 255, 102, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
      animation: boundary-shatter-loop 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .word-boundaries {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 3.8cqw;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 10px rgba(0, 255, 102, 0.8);
    }

    /* SCENE 2: Prismatic Diagonal Kinetic Slash Wipe (Word 3: BEYOND Climax) */
    .scene-2-morph {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #000000;
      clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
      animation: diagonal-slash-takeover-loop 5.5s cubic-bezier(0.77, 0, 0.175, 1) infinite;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .slash-laser-glare {
      position: absolute;
      top: -50%;
      bottom: -50%;
      left: -20%;
      width: 25px;
      background: var(--manim-green);
      box-shadow: 0 0 30px var(--manim-green), 0 0 60px #ffffff;
      transform: rotate(28deg);
      opacity: 0;
      animation: laser-glare-swipe-loop 5.5s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    .scene2-ambient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.28) 0%, rgba(255, 224, 102, 0.18) 50%, #000000 90%);
    }

    .energy-shockwave {
      position: absolute;
      width: 60cqw;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.6);
      z-index: 11;
      pointer-events: none;
      animation: shockwave-pulse 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    /* Word 3: BEYOND Bulletproof Viewport Sizing */
    .word-beyond-hero {
      position: relative;
      z-index: 12;
      font-family: 'Syne', sans-serif;
      font-weight: 900;
      font-size: 11.5cqw;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #ffffff;
      transform: scaleY(1.45) scaleX(0.80);
      transform-origin: center center;
      text-shadow: 0 0 45px rgba(0, 255, 102, 0.85), 0 15px 45px rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.02em;
      width: 78cqw;
      max-width: 78cqw;
    }

    .beyond-char {
      display: inline-block;
      animation: matrix-decrypt-loop 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .speed-lines {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0, 255, 102, 0.08) 15px, rgba(0, 255, 102, 0.08) 17px);
      animation: speed-fade-loop 5.5s ease infinite;
    }

    /* HUD Bar */
    .timer-hud {
      position: absolute;
      top: 3.5%;
      left: 5%;
      right: 5%;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Space Mono', monospace;
      font-size: 2.2cqw;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hud-badge {
      background: rgba(0, 255, 102, 0.25);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.5);
      backdrop-filter: blur(8px);
    }

    .grain {
      position: absolute;
      inset: -50%;
      z-index: 25;
      opacity: 0.12;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.8'/%3E%3C/svg%3E");
      animation: grain-noise 0.2s steps(2) infinite;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 24;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9), inset 0 -160px 120px rgba(0, 0, 0, 0.95);
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--manim-green);
      z-index: 30;
      width: 0%;
      animation: progress-run 5.5s linear infinite;
    }

    /* Keyframes */
    @keyframes scene1-loop {
      0% { opacity: 1; filter: blur(0px); }
      48% { opacity: 1; filter: blur(0px); }
      54% { opacity: 0; filter: blur(15px); }
      94% { opacity: 0; }
      100% { opacity: 1; filter: blur(0px); }
    }

    @keyframes chart-fade-loop {
      0% { opacity: 0; }
      8% { opacity: 0.95; }
      48% { opacity: 0.95; }
      54% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* 100% Precise Path Sweep Drawing (Normalized pathLength=1) */
    @keyframes manim-line-draw {
      0% { stroke-dashoffset: 1; }
      8% { stroke-dashoffset: 1; }
      38% { stroke-dashoffset: 0; }
      48% { stroke-dashoffset: 0; }
      54% { stroke-dashoffset: 1; }
      100% { stroke-dashoffset: 1; }
    }

    /* Synchronized Volumetric Fill Sweep */
    @keyframes fill-sweep-anim {
      0% { clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%); }
      8% { clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%); }
      38% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      48% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      54% { clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%); }
      100% { clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%); }
    }

    /* Physics Preset 1: Springboard Tilt for Winged Statue */
    @keyframes springboard-statue-loop {
      0% {
        opacity: 0;
        filter: blur(20px) contrast(1.6);
        transform: translate(-50%, -48%) rotateZ(-20deg) scale(1.15);
      }
      12% {
        opacity: 0.95;
        filter: blur(0px) contrast(1.3);
        transform: translate(-50%, -50%) rotateZ(0deg) scale(1);
      }
      48% { opacity: 0.95; transform: translate(-50%, -50%) rotateZ(0deg) scale(1); }
      54% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes char-reveal-loop {
      0% { opacity: 0; filter: blur(20px); transform: translateY(20px); }
      12% { opacity: 1; filter: blur(0px); transform: translateY(0); }
      48% { opacity: 1; transform: translateY(0); }
      54% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Shattering Boundary Wireframe Box */
    @keyframes boundary-shatter-loop {
      0% { opacity: 0; transform: scale(0.7); filter: blur(15px); }
      18% { opacity: 1; transform: scale(1); filter: blur(0px); }
      36% { opacity: 1; transform: scale(1.05); border-color: var(--manim-green); }
      44% { opacity: 0; transform: scale(1.35); filter: blur(12px); border-color: var(--gold-accent); }
      100% { opacity: 0; }
    }

    /* Prismatic Diagonal Kinetic Slash Wipe (48% to 94%) */
    @keyframes diagonal-slash-takeover-loop {
      0% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); opacity: 0; }
      48% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); opacity: 0; }
      58% { clip-path: polygon(0 0, 150% 0, 100% 150%, 0 100%); opacity: 1; }
      94% { clip-path: polygon(0 0, 150% 0, 100% 150%, 0 100%); opacity: 1; }
      98% { opacity: 0; clip-path: polygon(0 0, 150% 0, 100% 150%, 0 100%); }
      100% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); opacity: 0; }
    }

    @keyframes laser-glare-swipe-loop {
      0% { opacity: 0; left: -20%; }
      48% { opacity: 0; left: -20%; }
      56% { opacity: 1; left: 130%; }
      60% { opacity: 0; left: 130%; }
      100% { opacity: 0; left: -20%; }
    }

    /* Shockwave Pulse Keyframe */
    @keyframes shockwave-pulse {
      0% { transform: scale(0.2); opacity: 0; }
      52% { transform: scale(0.2); opacity: 0; }
      64% { transform: scale(1.8); opacity: 0.8; }
      78% { transform: scale(2.6); opacity: 0; }
      100% { opacity: 0; }
    }

    /* Matrix Cipher Decrypt Stagger Keyframe for BEYOND Climax */
    @keyframes matrix-decrypt-loop {
      0% { opacity: 0; filter: blur(28px); transform: translateY(35px) scale(0.6) rotateX(45deg); color: #00ff66; }
      50% { opacity: 0; filter: blur(28px); transform: translateY(35px) scale(0.6) rotateX(45deg); color: #00ff66; }
      58% { opacity: 0.6; filter: blur(12px); transform: translateY(-5px) scale(1.15) rotateX(-10deg); color: #ffe066; }
      66% { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1) rotateX(0deg); color: #ffffff; }
      94% { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1) rotateX(0deg); color: #ffffff; }
      98% { opacity: 0; filter: blur(15px); }
      100% { opacity: 0; }
    }

    @keyframes speed-fade-loop {
      0% { opacity: 0; }
      58% { opacity: 0; }
      66% { opacity: 0.6; }
      94% { opacity: 0.6; }
      98% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes progress-run {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes grain-noise {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 2%); }
      50% { transform: translate(2%, -1%); }
      75% { transform: translate(-1%, -2%); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
