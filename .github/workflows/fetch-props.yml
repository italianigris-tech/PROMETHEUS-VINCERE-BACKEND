name: Fetch Props from R2
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
        default: "gha_hakt_30s_pbd_1788904859"
jobs:
  fetch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3
      - env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PROCESSED_BUCKET: ${{ secrets.R2_PROCESSED_BUCKET }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python -c '
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT"], aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"], config=Config(signature_version="s3v4"), region_name="auto")
          bucket = os.environ.get("R2_PROCESSED_BUCKET", "prometheus-processed")
          job_id = os.environ["JOB_ID"]
          key = f"gha-renders/{job_id}/props.json"
          print(f"Downloading {key}...")
          s3.download_file(bucket, key, "props.json")
          print("Success!")
          '
      - uses: actions/upload-artifact@v4
        with:
          name: props-${{ inputs.job_id }}
          path: props.json
